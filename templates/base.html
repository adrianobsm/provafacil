<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="{{url_for('static',filename='style.css')}}"><title>{% block title %}ProvaFácil{% endblock %}</title></head><body><header><a class="brand" href="{{url_for('home')}}">ProvaFácil</a><nav>{% if u %}<span>{{u.name}}</span>{% if u.admin %}<a href="{{url_for('users')}}">Usuários</a><a href="{{url_for('questions')}}">Questões</a><a href="{{url_for('admin_exams')}}">Provas</a><a href="{{url_for('backup')}}">Backup</a>{% endif %}<a href="{{url_for('logout')}}">Sair</a>{% else %}<a href="{{url_for('login')}}">Entrar</a><a href="{{url_for('register')}}">Cadastre-se</a>{% endif %}</nav></header><main>{% for cat,msg in get_flashed_messages(with_categories=true) %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
