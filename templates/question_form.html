{% extends 'base.html' %}{% block content %}<section class="card"><h1>{{'Editar' if row else 'Nova'}} questão</h1><form method="post"><label>Assunto<input name="subject" value="{{row.subject if row else ''}}" required></label><label>Enunciado<textarea name="statement" required>{{row.statement if row else ''}}</textarea></label><div class="two"><label>Alternativa A<input name="a" value="{{row.a if row else ''}}" required></label><label>Alternativa B<input name="b" value="{{row.b if row else ''}}" required></label><label>Alternativa C<input name="c" value="{{row.c if row else ''}}" required></label><label>Alternativa D<input name="d" value="{{row.d if row else ''}}" required></label></div><label>Correta<select name="correct">{% for x in 'ABCD' %}<option {% if row and row.correct==x %}selected{% endif %}>{{x}}</option>{% endfor %}</select></label><label>Justificativa<textarea name="reason" required>{{row.reason if row else ''}}</textarea></label><button>Salvar</button></form></section>{% endblock %}
