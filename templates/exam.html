{% extends 'base.html' %}{% block content %}<section class="hero"><h1>{{e.title}}</h1><p>{{e.subject}} · {{e.total}} questões · mínimo {{e.minimum}}</p></section><form method="post" action="{{url_for('finish_exam',eid=e.id)}}">{% for q in qs %}<article class="question"><h3>{{loop.index}}. {{q.statement}}</h3>{% for l,f in [('A','a'),('B','b'),('C','c'),('D','d')] %}<label class="option"><input type="radio" name="q{{q.id}}" value="{{l}}"><span><b>{{l}}</b> {{q[f]}}</span></label>{% endfor %}</article>{% endfor %}<button class="wide">Concluir prova</button></form>{% endblock %}
