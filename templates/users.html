{% extends 'base.html' %}{% block content %}<div class="titlebar"><h1>Gestão de usuários</h1><a class="btn" href="{{url_for('user_new')}}">Novo usuário</a></div><section class="card table"><table><tr><th>Nome</th><th>Login</th><th>Perfil</th><th>Status</th><th>Ações</th></tr>{% for r in rows %}<tr><td>{{r.name}}</td><td>{{r.login}}</td><td>{{'Admin' if r.admin else 'Usuário'}}</td><td>{{'Ativo' if r.active else 'Inativo'}}</td><td><a class="btn" href="{{url_for('user_edit',uid=r.id)}}">Editar</a><form class="inline" method="post" action="{{url_for('user_password',uid=r.id)}}"><input class="small" type="password" name="password" placeholder="Nova senha" required><button>Resetar</button></form><form class="inline" method="post" action="{{url_for('user_delete',uid=r.id)}}" onsubmit="return confirm('Excluir usuário?')"><button class="danger">Excluir</button></form></td></tr>{% endfor %}</table></section>{% endblock %}
