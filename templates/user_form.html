{% extends 'base.html' %}{% block content %}<section class="card auth"><h1>{{'Editar' if row else 'Novo'}} usuário</h1><form method="post"><label>Nome<input name="name" value="{{row.name if row else ''}}" required></label><label>Login<input name="login" value="{{row.login if row else ''}}" required></label>{% if not row %}<label>Senha<input type="password" name="password" minlength="6" required></label>{% endif %}<label><input type="checkbox" name="admin" {% if row and row.admin %}checked{% endif %}> Administrador</label>{% if row %}<label><input type="checkbox" name="active" {% if row.active %}checked{% endif %}> Ativo</label>{% endif %}<button>Salvar</button></form></section>{% endblock %}
