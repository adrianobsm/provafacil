{% extends 'base.html' %}{% block title %}Criar conta | ProvaFácil{% endblock %}{% block content %}<section class="card auth"><h1>Criar minha conta</h1><p>Cadastre-se para criar, realizar e imprimir provas. A conta será criada como usuário comum.</p><form method="post" autocomplete="on"><label>Nome completo<input name="name" minlength="2" maxlength="100" value="{{request.form.get('name','')}}" required autofocus autocomplete="name"></label><label>Usuário<input name="login" minlength="3" maxlength="50" value="{{request.form.get('login','')}}" required autocomplete="username"></label><label>Senha<input type="password" name="password" minlength="6" required autocomplete="new-password"></label><label>Confirmar senha<input type="password" name="confirmation" minlength="6" required autocomplete="new-password"></label><button class="wide">Cadastrar</button></form><p>Já possui uma conta? <a href="{{url_for('login')}}">Entrar</a></p></section>{% endblock %}
