services:
  app:
    build: .
    network_mode: host
    restart: unless-stopped
    environment:
      SECRET_KEY: 12345678
      ADMIN_PASSWORD: 12345678
      DATABASE_PATH: /app/dados/provafacil.db
    volumes: ["./dados:/app/dados"]
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app